{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <h1 class="title">My Notes</h1>

    <a href="{{url_for('upload_note')}}"
       class="btn">

       Upload New Note

    </a>

</div>

{% if notes %}

    {% for note in notes %}

    <div class="card">

        <h3>{{note['subject']}}</h3>

        <img
            src="{{url_for(
            'static',
            filename='uploads/' + note['image'])}}"

            class="note-image"
        >

        <br><br>

        <a
           href="{{url_for(
           'download_file',
           filename=note['image'])}}"

           class="btn">

           Download

        </a>

    </div>

    {% endfor %}

{% else %}

    <div class="card">

        <p>
            You haven't uploaded any notes yet.
        </p>

        <a href="{{url_for('upload_note')}}"
           class="btn">

           Upload Your First Note

        </a>

    </div>

{% endif %}

{% endblock %}
