{% extends 'base.html' %}

{% block content %}

<h1>Student Blogs</h1>

<a href="{{url_for('create_blog')}}">
    Create Blog
</a>

<hr>

{% for blog in blogs %}

<div class="card">

    <h2>{{blog['title']}}</h2>

    <p>{{blog['content']}}</p>

    <p>

        Category:
        {{blog['category']}}

    </p>

    <p>

        Likes:
        {{blog['likes']}}

    </p>

    <a href="{{url_for('like_blog',
        id=blog['id'])}}">

        Like

    </a>

</div>

{% endfor %}

{% endblock %}
