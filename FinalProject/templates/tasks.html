{% extends 'base.html' %}

{% block content %}

<h1>Task Manager</h1>

<form method="post">

    <input type="text"
           name="title"
           placeholder="Task title"
           required>

    <input type="text"
           name="category"
           placeholder="Category">

    <input type="date"
           name="due_date">

    <button type="submit">
        Add Task
    </button>

</form>

<hr>

{% for task in tasks %}

<div class="card">

    <h3>{{task['title']}}</h3>

    <p>
        Category:
        {{task['category']}}
    </p>

    <p>
        Due Date:
        {{task['due_date']}}
    </p>

    <p>

        Status:

        {% if task['completed'] == 1 %}

            Completed

        {% else %}

            Pending

        {% endif %}

    </p>

    <a href="{{url_for('complete_task',
        id=task['id'])}}">

        Complete

    </a>

    |

    <a href="{{url_for('delete_task',
        id=task['id'])}}">

        Delete

    </a>

</div>

{% endfor %}

{% endblock %}
