{% extends 'base.html' %}

{% block content %}

<h1>Create Blog</h1>

<form method="post">

    <input type="text"
           name="title"
           placeholder="Blog title"
           required>

    <input type="text"
           name="category"
           placeholder="Category">

    <textarea name="content"
              rows="10"
              placeholder="Write your blog..."
              required></textarea>

    <button type="submit">

        Publish Blog

    </button>

</form>

{% endblock %}
